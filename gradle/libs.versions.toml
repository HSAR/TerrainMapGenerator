[versions]
batik = "1.19"
compose = "1.11.1"
compose-material3 = "1.9.0"
fastnoise = "0.10"
hamcrest = "1.3"
jackson = "2.22.0"
jcommander = "1.82"
junit = "5.7.2"
korge = "5.4.0"
log4j = "2.26.0"
opensimplex = "1.0.3"
tektosyne = "6.2.0"

[libraries]
batik-transcoder = { module = "org.apache.xmlgraphics:batik-transcoder", version.ref = "batik" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
fastnoise = { module = "com.personthecat:fastnoise", version.ref = "fastnoise" }
hamcrest = { module = "org.hamcrest:hamcrest-all", version.ref = "hamcrest" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jcommander = { module = "com.beust:jcommander", version.ref = "jcommander" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
korge = { module = "com.soywiz.korge:korge-jvm", version.ref = "korge" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
opensimplex = { module = "com.raylabz:opensimplex", version.ref = "opensimplex" }
tektosyne = { module = "org.kynosarges:tektosyne", version.ref = "tektosyne" }
